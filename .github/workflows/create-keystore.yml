name: Create keystore

# Run this once, by hand, from the Actions tab. It produces the signing key that
# Play requires. Download the artifact, then paste its contents into repository
# secrets. Keep the .jks file somewhere safe: losing it means you can never
# update the app under the same listing.
#
# The password is generated here rather than typed in. A workflow_dispatch input
# is displayed in the run summary and stays in the Actions history for as long as
# the run does, so asking for the signing password as an input would publish it
# to anyone who can read the repository. Instead a strong random one is made on
# the runner, masked out of the logs, and written into the artifact next to the
# keystore it belongs to.

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias'
        required: true
        default: 'moneyclarity'

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate
        env:
          ALIAS: ${{ github.event.inputs.alias }}
        run: |
          PASS="$(openssl rand -base64 30 | tr -d '/+=' | cut -c1-32)"
          echo "::add-mask::$PASS"

          keytool -genkeypair -v \
            -keystore release.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=MoneyClarity, OU=MoneyClarity, O=MoneyClarity, L=Jaipur, S=Rajasthan, C=IN"

          base64 -w 0 release.jks > keystore_base64.txt

          {
            echo "MoneyClarity Calc signing key"
            echo "Generated: $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo
            echo "Put these four into Settings > Secrets and variables > Actions."
            echo
            echo "KEY_ALIAS=$ALIAS"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
            echo "KEYSTORE_BASE64=(the whole contents of keystore_base64.txt)"
            echo
            echo "Then store release.jks somewhere permanent and private."
            echo "Losing it means you can never update this listing again."
          } > SECRETS-READ-ME.txt

          echo "Done. Download the artifact below, then delete it once the"
          echo "secrets are saved. Nothing sensitive was printed to this log."

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore-KEEP-THIS-SAFE
          path: |
            release.jks
            keystore_base64.txt
            SECRETS-READ-ME.txt
          retention-days: 1
