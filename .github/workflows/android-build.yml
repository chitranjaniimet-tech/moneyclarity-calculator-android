name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Test, lint and build debug APK
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/build-debug.log"

      # Actions job logs redirect through Azure blob storage on failure just
      # like artifacts do, so a failed build's own log is not fetchable from
      # a restricted network either. This publishes the tail of the log as a
      # release asset instead -- the one path already proven reachable -- so
      # a failure can actually be read rather than just observed as red.
      - name: Publish build log on failure
        if: failure()
        run: |
          tail -c 60000 "$RUNNER_TEMP/build-debug.log" > "$RUNNER_TEMP/build-error.txt" || true
          TAG="build-log-${{ github.run_id }}"
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "$(python3 -c 'import json,sys; print(json.dumps({"tag_name": sys.argv[1], "name": sys.argv[1], "body": "Build failure log, safe to delete.", "prerelease": True}))' "$TAG")" \
            > "$RUNNER_TEMP/release.json"
          UPLOAD_URL=$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/release.json'))['upload_url'].split('{')[0])")
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: text/plain" \
            --data-binary @"$RUNNER_TEMP/build-error.txt" \
            "$UPLOAD_URL?name=build-error.txt"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret set. Run the Create keystore workflow first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk

      # Actions artifacts are served through Azure blob storage, reachable
      # only from inside GitHub's own web UI or a client with unrestricted
      # network access. Release assets are served from
      # release-assets.githubusercontent.com instead, reachable from far more
      # restrictive networks, so the signed bundle is published as a release
      # rather than relying on the artifact download alone.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
